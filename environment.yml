name: pollution-track-env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas
  - scipy
  - matplotlib
  - cartopy
  - requests
  - pillow
  - openpyxl          # reads the DENR-EMB station .xlsx
  - scikit-learn      # PM retrieval from AOD/CO
  - ffmpeg            # MP4 encoding; imageio-ffmpeg is the fallback
  - tqdm
